name: Test template

# Runs the ___TESTS___ scenarios embedded in template.tpl against the real
# ___SANDBOXED_JS_FOR_WEB_TEMPLATE___ source. Google ships no CLI runner for GTM
# custom templates — test/run-tpl-tests.mjs shims the Test API so the same
# scenarios that run in the GTM UI "Tests" tab also gate every PR.
on:
  pull_request:
  push:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Test template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly the committed
      # lockfile and fails if package.json and the lock have drifted.
      - run: npm ci

      - run: npm test

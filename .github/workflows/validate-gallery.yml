name: Validate gallery contract

# Guards the GTM Community Template Gallery submission contract. The gallery
# publishes no submission-status feedback and re-checks repositories on a 2-3 day
# cycle, so a violation is invisible until it becomes an outage — SUP-1008 was
# found by a customer roughly a day after the LICENSE was replaced. This is the
# only place a violation can be caught before it ships.
#
# Runs on pushes to master as well as pull requests: the LICENSE regression
# reached master through a merge, which a PR-only gate would not have stopped.
on:
  # Both branches, on purpose. The Compliance ruleset makes this a required
  # status check on develop as well as on master, and a required check that
  # never runs blocks the merge rather than passing it. Feature PRs now target
  # develop, and the promotion PR targets master.
  pull_request:
    branches:
      - master
      - develop
  push:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  validate:
    name: Validate gallery contract
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the version checks resolve every versions[].sha and test
      # ancestry against HEAD, which a shallow clone cannot answer.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # The template.tpl JavaScript syntax check shells out to `node --check`, and
      # degrades to a warning when node is absent. Pin it explicitly rather than
      # relying on whatever the runner image ships, so the check cannot quietly
      # stop running.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install PyYAML
        run: pip install --disable-pip-version-check pyyaml

      - name: Validate
        # GH_TOKEN lets the script read repository settings for the Issues warning.
        # It is warn-only, so the step still passes if the call is unavailable.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/validate-gallery.py

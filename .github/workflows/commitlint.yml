name: Lint commits

# Enforces Conventional Commits on pull requests. Runs entirely in CI, so
# contributors don't need any local toolchain (no npm install / git hooks).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    # This repo merges with merge commits, so the commits job below is the one
    # release-please actually depends on. Keep this as hygiene, and as the
    # safety net if squash-merging is ever enabled — then the PR title would
    # become the commit message on master.
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            perf
            test
            ci
            build
            revert
          # Scopes are optional; allow any (the commitlint job warns on unknown ones).
          requireScope: false
          # Subject should not start with an uppercase letter.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. The subject must start with a
            lowercase letter.

  commits:
    # Lints every commit in the PR against commitlint.config.mjs. Useful when a
    # PR is merged with a merge commit rather than squashed.
    name: Validate commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: commitlint.config.mjs

name: Release

# Drives Semantic Versioning from Conventional Commits. On every push to
# develop, release-please maintains a "release PR". A follow-up job then
# rewrites that PR's branch so that (a) every commit on it is GPG-signed and
# (b) metadata.yaml carries the new GTM gallery entry. Merging the PR lands
# VERSION, CHANGELOG.md, .release-please-manifest.json and metadata.yaml in a
# single merge commit, and the next run tags it and publishes the GitHub
# Release.
#
# Everything here happens on develop, and none of it reaches the gallery on its
# own: Google reads metadata.yaml from the DEFAULT branch, which is master. A
# release goes live only when develop is promoted to master — see promote.yml
# and docs/release-automation.md.
#
# Why the branch is rewritten rather than just appended to:
#   release-please creates its commit through the Git Data API, which cannot
#   sign. The Compliance ruleset requires signed commits on develop as well as
#   on master, and GitHub refuses to merge a pull
#   request containing an unverified commit — the sibling repo
#   axeptio-gtm-public-template has needed an admin override
#   (overridden_codes: ["invalid_signature"]) on every single release merge.
#   That escape hatch does not exist here: the ruleset has no bypass actor and
#   rulesets grant admins no implicit bypass, so an unsigned release commit
#   would be unmergeable by anyone. This job replays release-please's commit
#   under the bot's GPG key.
#
# Why the metadata sync happens inside the release PR rather than as a separate
# PR of its own (which is what the sibling repo does):
#   nothing can push directly to develop either — the Review ruleset requires a
#   pull request on develop as well as on master — so a push was never an
#   option. Given that, folding the entry into the release PR beats opening a
#   second one: the gallery entry is validated by the same `Validate gallery
#   contract` run that gates the release, and the whole release lands in one
#   merge. The sibling's separate sync PR is opened only *after* the release is
#   already tagged and published, which leaves a window where the tag exists but
#   the gallery entry does not.
#
# Why not the canonical axeptio/tech-scripts caller workflows (ENG-11756)?
#   This repository is PUBLIC and tech-scripts is INTERNAL. GitHub only lets a
#   public caller repository use reusable workflows from PUBLIC repositories.
#   See docs/release-automation.md.
on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Never run two of these at once: release-please force-pushes the release
# branch, so an overlapping run could wipe a sync a newer run already did.
# cancel-in-progress must stay false — cancelling the run that re-signs the
# branch is exactly the failure being avoided.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain the release PR
    runs-on: ubuntu-latest
    steps:
      # Authenticate as axeptio-bot: the org forbids the default GITHUB_TOKEN
      # from creating or approving PRs (can_approve_pull_request_reviews=false),
      # so release-please cannot open its release PR without a real bot account.
      #
      # target-branch is pinned rather than left to default. It defaults to the
      # repository's DEFAULT branch — master, which the gallery contract
      # requires it to stay — so the fallback would open the release PR against
      # the branch this flow releases *to*, not the one it releases *from*.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: develop
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

  sync-release-branch:
    name: Sign the release commit and sync metadata.yaml
    # Runs after release-please so it sees the PR release-please just wrote.
    needs: release-please
    runs-on: ubuntu-latest
    steps:
      # Locate the release PR by label rather than through the action's outputs:
      # the action declares no outputs in action.yml and sets them dynamically,
      # and they differ between the "PR created", "PR updated" and "PR left
      # alone" paths. The label is on the PR in all three. No open release PR —
      # e.g. the run that publishes the release — leaves `branch` empty and
      # skips every step below.
      - name: Locate the open release PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch=$(gh pr list --repo "$REPO" --state open \
            --label "autorelease: pending" \
            --json headRefName --jq '.[0].headRefName // ""')
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "Release branch: ${branch:-<none>}"

      # fetch-depth: 0 is load-bearing twice over. actions/checkout only fetches
      # every head (+refs/heads/*:refs/remotes/origin/*) when fetch-depth <= 0,
      # which is what gives this job origin/develop with full history — needed
      # both for the template.tpl lookup and for the merge-base below — plus the
      # remote-tracking ref that --force-with-lease compares against. The
      # default depth of 1 breaks all of it.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        if: ${{ steps.pr.outputs.branch != '' }}
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      # Imports the bot's key, sets git user.name/user.email from the key
      # identity and turns on commit.gpgsign globally.
      - name: Import the bot GPG key
        if: ${{ steps.pr.outputs.branch != '' }}
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ steps.pr.outputs.branch != '' }}
        with:
          node-version: 20

      - name: Work out the release tag and the gallery SHA
        id: facts
        if: ${{ steps.pr.outputs.branch != '' }}
        run: |
          set -euo pipefail
          # VERSION has already been bumped by release-please on this branch.
          version=$(tr -d '[:space:]' < VERSION)
          # The gallery publishes a template *at a commit*, so the entry must
          # point at the last commit that actually changed template.tpl. The
          # release merge commit does not exist yet. History simplification
          # resolves this to the branch commit rather than the merge commit,
          # which is the convention this repo already follows: metadata.yaml's
          # e2999f6b… is the "Update template.tpl" commit.
          # origin/develop, not origin/master: the template change being released
          # is on develop and has not been promoted yet, so master still points
          # at the PREVIOUS template commit. Reading it there would publish a
          # gallery entry for the wrong commit — a duplicate of the last one.
          sha=$(git log -1 --format=%H origin/develop -- template.tpl)
          if [[ -z "${sha}" ]]; then
            echo "::error::Found no commit touching template.tpl on develop." >&2
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${sha} as v${version}."

      - name: Re-sign the release commit and sync metadata.yaml
        if: ${{ steps.pr.outputs.branch != '' }}
        # RELEASE_TAG goes through env rather than being interpolated straight
        # into the script: never expand ${{ }} inside a run: block.
        env:
          RELEASE_TAG: ${{ steps.facts.outputs.tag }}
          RELEASE_SHA: ${{ steps.facts.outputs.sha }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          set -euo pipefail

          # release-please's commit is always unsigned (%G? == N); every commit
          # this job makes is signed. A signed tip therefore means the branch
          # has already been processed and release-please has not rewritten it
          # since — nothing to do.
          if [[ "$(git log -1 --format='%G?' HEAD)" != "N" ]]; then
            echo "Release branch tip is already signed; nothing to do."
            exit 0
          fi

          orig=$(git rev-parse HEAD)
          # Not origin/develop: develop may have moved on since release-please
          # cut this branch, and resetting onto a newer develop would silently
          # revert whatever landed in between. merge-base is where it was cut.
          base=$(git merge-base HEAD origin/develop)

          # Replay release-please's commit — same tree, same message, same
          # author — this time GPG-signed.
          git reset --soft "${base}"
          git commit -S -C "${orig}"

          node scripts/update-metadata-version.mjs
          if [[ -n "$(git status --porcelain metadata.yaml)" ]]; then
            git add metadata.yaml
            git commit -S -m "chore(metadata): sync version history for ${RELEASE_TAG}"
          else
            echo "template.tpl unchanged in this release; no new gallery entry."
          fi

          # --force-with-lease pinned to the SHA checked out above: if
          # release-please force-pushed again while this job ran, fail loudly
          # rather than clobber it. Its next run re-triggers this job.
          git push --force-with-lease="${BRANCH}:${orig}" \
                   origin "HEAD:refs/heads/${BRANCH}"
